<section id="contact" class="py-20 px-4 max-w-3xl mx-auto">
    <h2 class="text-2xl sm:text-3xl font-bold mb-6 text-slate-100 flex items-center gap-3">
      <i class="fa-solid fa-envelope text-cyan-400 text-xl"></i> Contact Me
    </h2>
  
    <!-- Direct Contact Info Badges -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-8">
      <a href="tel:8867222325" class="p-4 bg-slate-800 rounded-xl border border-slate-700 flex items-center gap-4 hover:border-cyan-400 transition">
        <i class="fa-solid fa-phone text-cyan-400 text-xl"></i>
        <div>
          <span class="text-xs text-slate-400 block">Phone</span>
          <span class="text-sm font-semibold text-slate-200">+91 8867222325</span>
        </div>
      </a>
      <a href="mailto:pradeepdshettigar7@gmail.com" class="p-4 bg-slate-800 rounded-xl border border-slate-700 flex items-center gap-4 hover:border-cyan-400 transition">
        <i class="fa-solid fa-envelope text-cyan-400 text-xl"></i>
        <div>
          <span class="text-xs text-slate-400 block">Email</span>
          <span class="text-sm font-semibold text-slate-200 truncate block">pradeepdshettigar7@gmail.com</span>
        </div>
      </a>
    </div>
  
    <form id="contact-form" class="space-y-4">
      <div>
        <label for="name" class="block text-sm font-medium mb-1 text-slate-300">Name</label>
        <input type="text" id="name" required class="w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-lg focus:outline-none focus:border-cyan-400 text-slate-100" />
      </div>
      <div>
        <label for="email" class="block text-sm font-medium mb-1 text-slate-300">Email</label>
        <input type="email" id="email" required class="w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-lg focus:outline-none focus:border-cyan-400 text-slate-100" />
      </div>
      <div>
        <label for="message" class="block text-sm font-medium mb-1 text-slate-300">Message</label>
        <textarea id="message" rows="4" required class="w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-lg focus:outline-none focus:border-cyan-400 text-slate-100"></textarea>
      </div>
      <button type="submit" class="w-full py-3 bg-cyan-500 hover:bg-cyan-600 font-semibold rounded-lg transition text-slate-900">Send Message</button>
    </form>
  </section>
